<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case · PayBox Tribunal</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #0052ff; --ink: #0a0b0d; --body: #5b616e; --muted: #7c828a; --hairline: #dee1e6;
    --canvas: #ffffff; --soft: #f7f7f7; --strong: #eef0f3; --dark: #0a0b0d; --dark-2: #16181c; --on-dark-soft: #a8acb3;
    --up: #05b169; --down: #cf202f;
    --font: "Inter", -apple-system, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--soft); color: var(--body); font: 400 16px/1.5 var(--font); }
  a { color: var(--primary); text-decoration: none; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
  nav { background: var(--canvas); border-bottom: 1px solid var(--strong); }
  nav .wrap { height: 64px; display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; color: var(--ink); }
  header { background: var(--dark); color: var(--on-dark-soft); padding: 56px 0 64px; }
  header h1 { color: #fff; font-size: 52px; font-weight: 400; letter-spacing: -1.3px; line-height: 1.05; margin: 16px 0 0; }
  header p { max-width: 720px; font-size: 18px; margin: 16px 0 0; }
  .badge { display: inline-block; padding: 4px 12px; border-radius: 100px; font: 600 12px/1.5 var(--font); letter-spacing: .6px; text-transform: uppercase; background: var(--dark-2); color: #fff; }
  .verdict-pill { display: inline-flex; gap: 8px; align-items: center; padding: 8px 16px; border-radius: 100px; font: 600 15px var(--font); margin-top: 24px; }
  .ok { background: #e3f6ee; color: #048a52; } .bad { background: #fbe9eb; color: var(--down); } .neutral { background: var(--strong); color: var(--ink); }
  main .wrap { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: -32px; padding-bottom: 64px; }
  @media (max-width: 960px) { main .wrap { grid-template-columns: 1fr; } header h1 { font-size: 36px; } }
  .col { background: var(--canvas); border-radius: 24px; padding: 32px; border: 1px solid var(--hairline); min-width: 0; }
  .col .step { width: 40px; height: 40px; border-radius: 50%; background: var(--strong); color: var(--primary); display: grid; place-items: center; font: 500 14px var(--mono); }
  .col h2 { color: var(--ink); font-size: 28px; font-weight: 400; letter-spacing: -.5px; margin: 16px 0 4px; }
  .col .sub { color: var(--muted); font-size: 14px; margin: 0 0 20px; }
  ul.items { list-style: none; padding: 0; margin: 0; }
  ul.items li { border-top: 1px solid var(--hairline); padding: 12px 0; font-size: 15px; display: flex; gap: 10px; }
  ul.items li:first-child { border-top: 0; }
  .dot { flex: none; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font: 700 12px var(--font); color: #fff; margin-top: 2px; }
  .dot.ok { background: var(--up); } .dot.bad { background: var(--down); } .dot.info { background: var(--primary); } .dot.muted { background: var(--muted); }
  .kv { font-size: 13px; color: var(--muted); margin-top: 16px; overflow-wrap: anywhere; }
  .kv b { color: var(--ink); font-weight: 500; font-family: var(--mono); font-size: 12px; }
  .big { font-size: 40px; font-weight: 400; letter-spacing: -1px; color: var(--ink); line-height: 1.1; margin: 4px 0 8px; }
  .btn { display: inline-flex; align-items: center; height: 40px; padding: 0 18px; border-radius: 100px; border: 0; background: var(--strong); color: var(--ink); font: 600 14px var(--font); cursor: pointer; margin-top: 16px; }
  .btn.primary { background: var(--primary); color: #fff; }
  .tag { font: 600 11px/1 var(--font); padding: 5px 8px; border-radius: 100px; background: var(--strong); color: var(--ink); text-transform: capitalize; white-space: nowrap; }
  pre { background: var(--soft); border-radius: 12px; padding: 16px; font: 12px/1.5 var(--mono); overflow-x: auto; }
  .empty { text-align: center; padding: 120px 24px; color: var(--muted); }
</style>
</head>
<body>
<nav><div class="wrap"><a class="brand" href="/"><img src="/logo.svg" width="28" height="28" alt="">PayBox Tribunal</a><a href="/#live">All verdicts →</a></div></nav>
<div id="root"><p class="empty">Loading case…</p></div>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const id = location.pathname.split("/").filter(Boolean).pop();
  const explorers = { "eip155:84532": "https://sepolia.basescan.org/tx/", "eip155:8453": "https://basescan.org/tx/" };
  const time = (t) => new Date(t).toLocaleString();
  const stateLabel = {
    authorized: ["info", "Payment signed and verified, not settled"],
    voucher: ["info", "Free attempt with a credit"],
    judged: ["info", "Judged against the contract"],
    not_charged: ["ok", "Not charged: settlement cancelled"],
    settling: ["info", "Submitting payment"],
    settled: ["ok", "Settled on-chain"],
    settle_failed: ["bad", "Settlement failed at the facilitator"],
    reconciled_settled: ["ok", "Reconciled: settled on-chain"],
    expired_unsettled: ["ok", "Reconciled: expired unused, never charged"],
  };

  async function load() {
    const res = await fetch(`/verdicts/${id}`);
    if (!res.ok) { document.getElementById("root").innerHTML = `<p class="empty">Case not found.</p>`; return; }
    const v = await res.json();
    const contract = await fetch(`/${v.service}/contract`).then((r) => r.json());
    const delivered = v.decision === "delivered";
    const p = v.payment;
    const charged = p.status === "settled";
    const cert = v.certificate;

    const headline = delivered
      ? (charged ? "Promise kept. Payment settled." : "Promise kept. Payment " + (p.status === "pending" ? "settling." : p.status === "not_attempted" ? "covered by a credit." : "failed to settle."))
      : "Promise broken. Buyer never charged.";

    const promiseItems = [
      ...contract.guarantees.map((g) => `<li><span class="dot info">•</span><span>${esc(g)}</span></li>`),
      ...(v.sellerPromises ?? []).map((sp) => `<li><span class="dot info">•</span><span>${esc(sp.text)} <span class="tag">${esc(sp.certainty)}</span></span></li>`),
    ].join("");

    const violations = v.verdict.rules.violations;
    const evidenceItems = [
      `<li><span class="dot ${violations.length ? "bad" : "ok"}">${violations.length ? "✕" : "✓"}</span><span>${violations.length ? `${violations.length} rule check(s) failed` : "Schema and every objective rule passed"}</span></li>`,
      ...violations.map((x) => `<li><span class="dot bad">✕</span><span><b style="color:var(--ink)">${esc(x.rule)}</b>: ${esc(x.detail)}</span></li>`),
      `<li><span class="dot ${v.verdict.judge.status === "breach" ? "bad" : v.verdict.judge.status === "upheld" ? "ok" : "muted"}">${v.verdict.judge.status === "breach" ? "✕" : v.verdict.judge.status === "upheld" ? "✓" : "–"}</span><span>AI judge: <b style="color:var(--ink)">${esc(v.verdict.judge.status)}</b>. ${esc(v.verdict.judge.reasoning)}</span></li>`,
    ].join("");

    const timeline = p.timeline.map((e) => {
      const [tone, label] = stateLabel[e.state] ?? ["muted", e.state];
      return `<li><span class="dot ${tone}">${tone === "bad" ? "!" : tone === "ok" ? "✓" : "•"}</span><span><b style="color:var(--ink)">${esc(label)}</b><br><span style="font-size:13px;color:var(--muted)">${esc(e.note)} · ${esc(time(e.at))}</span></span></li>`;
    }).join("");
    const tx = p.settlement?.transaction?.startsWith("0x")
      ? `<a href="${explorers[p.settlement.network] ?? "#"}${esc(p.settlement.transaction)}" target="_blank" rel="noopener">View transaction →</a>` : "";

    document.getElementById("root").innerHTML = `
      <header><div class="wrap">
        <span class="badge">Case · ${esc(v.service)} · ${esc(time(v.createdAt))}</span>
        <h1>${esc(headline)}</h1>
        <p>${esc(v.verdict.summary)}</p>
        <span class="verdict-pill ${delivered ? "ok" : "bad"}">${delivered ? "Delivered" : "Rejected · HTTP 422"}</span>
        <span class="verdict-pill ${charged ? "neutral" : "ok"}" style="margin-left:8px">${charged ? "Charged" : "Not charged"}</span>
      </div></header>
      <main><div class="wrap">
        <section class="col">
          <div class="step">01</div><h2>Promise</h2>
          <p class="sub">What the seller guaranteed, pinned to contract v${esc(cert.contract.version)}.</p>
          <ul class="items">${promiseItems}</ul>
          <div class="kv">Contract hash<br><b>${esc(cert.contract.hash)}</b></div>
        </section>
        <section class="col">
          <div class="step">02</div><h2>Evidence</h2>
          <p class="sub">What Tribunal checked, in order: schema, rules, then the AI judge.</p>
          <ul class="items">${evidenceItems}</ul>
          <div class="kv">Evaluated output hash<br><b>${esc(cert.evaluated_output_hash)}</b></div>
        </section>
        <section class="col">
          <div class="step">03</div><h2>Payment</h2>
          <p class="sub">Tracked separately from the verdict.</p>
          <div class="big">${charged ? "Charged" : p.status === "pending" ? "Settling" : p.status === "failed" ? "Settlement failed" : "Not charged"}</div>
          ${tx}
          <ul class="items" style="margin-top:12px">${timeline || "<li>No payment events recorded.</li>"}</ul>
          ${cert.payment.nonce ? `<div class="kv">Authorization nonce<br><b>${esc(cert.payment.nonce)}</b></div>` : ""}
          ${p.status === "pending" || p.status === "failed" ? `<button class="btn" id="reconcile">Check on-chain</button>` : ""}
        </section>
        <section class="col" style="grid-column:1/-1">
          <h2 style="margin-top:0">Signed certificate</h2>
          <p class="sub">Ed25519 over the canonical JSON. Anyone can verify it with the public key at <a href="/certificates/key">/certificates/key</a>.</p>
          <button class="btn primary" id="verify">Verify signature</button> <span id="verified" style="margin-left:12px;font-weight:600"></span>
          <details style="margin-top:16px"><summary style="cursor:pointer;color:var(--ink);font-weight:500">Show certificate</summary><pre>${esc(JSON.stringify(cert, null, 2))}</pre></details>
        </section>
      </div></main>`;

    document.getElementById("verify").onclick = async () => {
      const r = await fetch("/certificates/verify", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ certificate: cert, signature: v.signature }) }).then((x) => x.json());
      const el = document.getElementById("verified");
      el.textContent = r.valid ? "✓ Valid signature" : "✕ Invalid signature";
      el.style.color = r.valid ? "var(--up)" : "var(--down)";
    };
    const rec = document.getElementById("reconcile");
    if (rec) rec.onclick = async () => { rec.disabled = true; await fetch(`/cases/${id}/reconcile`, { method: "POST" }); load(); };
  }
  load();
</script>
</body>
</html>
