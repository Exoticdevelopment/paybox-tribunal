<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contracts · PayBox Tribunal</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #0052ff; --ink: #0a0b0d; --body: #5b616e; --muted: #7c828a; --hairline: #dee1e6;
    --canvas: #ffffff; --soft: #f7f7f7; --strong: #eef0f3; --dark: #0a0b0d; --on-dark-soft: #a8acb3;
    --up: #05b169; --font: "Inter", -apple-system, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--soft); color: var(--body); font: 400 16px/1.5 var(--font); }
  a { color: var(--primary); text-decoration: none; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
  nav { background: var(--canvas); border-bottom: 1px solid var(--strong); }
  nav .wrap { height: 64px; display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; color: var(--ink); }
  header { background: var(--dark); color: var(--on-dark-soft); padding: 56px 0 72px; }
  header h1 { color: #fff; font-size: 52px; font-weight: 400; letter-spacing: -1.3px; line-height: 1.05; margin: 0; }
  header p { max-width: 720px; font-size: 18px; margin: 16px 0 0; }
  main .wrap { display: grid; gap: 24px; margin-top: -40px; padding-bottom: 64px; }
  .card { background: var(--canvas); border: 1px solid var(--hairline); border-radius: 24px; padding: 32px; }
  .top { display: flex; flex-wrap: wrap; gap: 12px 24px; justify-content: space-between; align-items: baseline; }
  .card h2 { color: var(--ink); font-size: 30px; font-weight: 400; letter-spacing: -.5px; margin: 0; }
  .price { font: 500 22px var(--mono); color: var(--ink); }
  .desc { margin: 8px 0 20px; }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .pill { background: var(--strong); color: var(--ink); border-radius: 100px; padding: 4px 12px; font: 600 12px/1.5 var(--font); }
  .pill.on { background: #e3f6ee; color: #048a52; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid var(--hairline); color: var(--ink); }
  li:first-child { border-top: 0; }
  .dot { flex: none; width: 20px; height: 20px; border-radius: 50%; background: var(--up); color: #fff; display: grid; place-items: center; font: 700 12px var(--font); margin-top: 2px; }
  .sub { color: var(--muted); font-size: 14px; margin: 20px 0 8px; font-weight: 600; }
  .hash { font: 12px var(--mono); color: var(--muted); overflow-wrap: anywhere; margin-top: 16px; }
  .links { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 16px; font-weight: 600; font-size: 14px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 8px; }
  .box { background: var(--soft); border-radius: 16px; padding: 20px; }
  .box h3 { color: var(--ink); font-size: 15px; font-weight: 600; margin: 0 0 10px; }
  .field { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--hairline); font-size: 14px; }
  .box h3 + .field { border-top: 0; }
  .field b { color: var(--ink); font: 500 13px var(--mono); }
  .field span { color: var(--muted); text-align: right; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 8px; }
  .stat { background: var(--soft); border-radius: 16px; padding: 16px; }
  .stat .n { font: 400 30px/1.1 var(--font); color: var(--ink); letter-spacing: -.5px; }
  .stat .l { font-size: 13px; color: var(--muted); }
  .stat.good .n { color: #048a52; }
  .flow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 8px 0 24px; }
  .flow div { background: var(--soft); border-radius: 16px; padding: 16px; font-size: 14px; }
  .flow b { display: block; color: var(--ink); margin-bottom: 4px; }
  .flow .bad { background: #fdecec; }
  .flow .ok { background: #e3f6ee; }
  @media (max-width: 760px) { .grid2, .flow { grid-template-columns: 1fr; } .stats { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 640px) { header h1 { font-size: 36px; } .card { padding: 24px; } }
</style>
</head>
<body>
<nav><div class="wrap"><a class="brand" href="/"><img src="/logo.svg" width="28" height="28" alt="">PayBox Tribunal</a><a href="/#live">All verdicts →</a></div></nav>
<header><div class="wrap">
  <h1 id="h1">The contracts</h1>
  <p id="lead">What every service promises, published before you pay and pinned by hash. If a result breaks any of these, the response is 422 and your payment is never settled.</p>
</div></header>
<main><div class="wrap" id="list"><div class="card">Loading contracts…</div></div></main>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const networks = {
    "eip155:8453": "Base", "eip155:84532": "Base Sepolia (testnet)",
    "solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp": "Solana", "solana:EtWTRABZaYq6iMfeYKouRu166VU2xqa1": "Solana devnet",
  };
  // /<service>/contract shows one service in depth; /contracts lists them all.
  const single = location.pathname.match(/^\/([a-z0-9-]+)\/contract\/?$/)?.[1];

  /** One row per field of a JSON schema, in plain words. */
  const fields = (schema) => Object.entries(schema?.properties ?? {}).map(([name, p]) => {
    const type = p.enum ? p.enum.join(" · ") : p.type === "array" ? "list" : p.type ?? "value";
    const range = p.minimum !== undefined && p.maximum !== undefined ? `${p.minimum}–${p.maximum}` : "";
    const extra = [p.description, p.default !== undefined ? `default ${p.default}` : "", range].filter(Boolean).join(" · ");
    const optional = (schema.required ?? []).includes(name) ? "" : " (optional)";
    return `<div class="field"><b>${esc(name)}${optional}</b><span>${esc(type)}${extra ? ` · ${esc(extra)}` : ""}</span></div>`;
  }).join("") || '<div class="field"><span>Free-form</span></div>';

  const pct = (n) => (n == null ? "–" : `${Math.round(n)}`);

  /** How the service is judged and what judging costs, so a guarantee never costs more than the payment. */
  function adjudication(c) {
    const a = c.adjudication;
    if (!a) return "";
    const m = a.measured ?? {};
    const measured = m.reviewedCases
      ? `$${Number(m.avgReviewUsd).toFixed(5)} per AI-reviewed call (${(m.shareOfPrice * 100).toFixed(1)}% of the price, ${m.reviewedCases} cases)`
      : "no AI-reviewed calls yet";
    return `
        <div class="sub">How it's judged, and what judging costs</div>
        <div class="stats">
          <div class="stat good"><div class="n">$0</div><div class="l">Rule checks (plain code, every call)</div></div>
          <div class="stat"><div class="n" style="font-size:22px">${esc(a.aiJudge)}</div><div class="l">AI judge, only for what rules can't see</div></div>
          <div class="stat"><div class="n" style="font-size:22px">${m.reviewedCases ? `${(m.shareOfPrice * 100).toFixed(1)}%` : "–"}</div><div class="l">Measured AI cost, share of the price</div></div>
          <div class="stat good"><div class="n" style="font-size:22px">0</div><div class="l">Humans in the loop</div></div>
        </div>
        <p class="desc" style="margin-top:12px">${esc(a.budget)} The second AI review runs ${esc(a.secondReview)}. Measured: ${esc(measured)}.</p>`;
  }

  function card(c, t) {
    const rails = (c.rails ?? [{ network: c.network }]).map((r) => `<span class="pill">USDC · ${esc(networks[r.network] ?? r.network)}</span>`).join("");
    const trust = t ? `
        <div class="sub">Track record (real paid calls only)</div>
        <div class="stats">
          <div class="stat"><div class="n">${pct(t.score)}</div><div class="l">Trust score</div></div>
          <div class="stat"><div class="n">${t.attempts}</div><div class="l">Judged calls</div></div>
          <div class="stat good"><div class="n">${t.rejectedBeforeCharge}</div><div class="l">Broken promises, buyer paid $0</div></div>
          <div class="stat ${t.chargedFailures ? "" : "good"}"><div class="n">${t.chargedFailures}</div><div class="l">Times a buyer paid for a bad result</div></div>
        </div>` : "";
    const detail = single ? `
        <div class="sub">How a call works</div>
        <div class="flow">
          <div><b>1. You sign</b>A ${esc(c.price)} USDC payment. Nothing moves yet.</div>
          <div><b>2. Service runs</b>Tribunal holds the payment while the work is done.</div>
          <div class="ok"><b>3a. Promise kept</b>HTTP 200, the result, and the payment settles.</div>
          <div class="bad"><b>3b. Promise broken</b>HTTP 422 and a public verdict. You are never charged.</div>
        </div>
        <div class="grid2">
          <div class="box"><h3>What you send</h3>${fields(c.input)}</div>
          <div class="box"><h3>What you get back</h3>${fields(c.output)}</div>
        </div>` : "";
    const seller = c.sellerPromises.length
      ? `<div class="sub">Seller promises (compiled from plain language)</div><ul>${c.sellerPromises.map((p) => `<li><span class="dot">✓</span><span>${esc(p.text)} <span class="pill">${esc(p.certainty)}</span></span></li>`).join("")}</ul>`
      : "";
    const notGuaranteed = c.notGuaranteed.length
      ? `<div class="sub">Not guaranteed</div><ul>${c.notGuaranteed.map((u) => `<li><span class="dot" style="background:var(--muted)">–</span><span>${esc(u.text)}: ${esc(u.reason)}</span></li>`).join("")}</ul>`
      : "";
    const links = single ? '<a href="/contracts">All contracts</a>' : `<a href="/${esc(c.service)}/contract">Open this contract</a>`;
    return `
      <section class="card" id="${esc(c.service)}">
        <div class="top"><h2>${esc(c.title)}</h2><span class="price">${esc(c.price)} / call</span></div>
        <p class="desc">${esc(c.description)}</p>
        <div class="pills">
          <span class="pill">${esc(c.endpoint)}</span>
          ${rails}
          <span class="pill on">Settled only after validation</span>
          <span class="pill ${c.aiJudge ? "on" : ""}">AI judge ${c.aiJudge ? "on" : "off"}</span>
          <span class="pill">Contract v${esc(c.version)}</span>
        </div>
        <div class="sub">Guaranteed, or you don&#39;t pay</div>
        <ul>${c.guarantees.map((g) => `<li><span class="dot">✓</span><span>${esc(g)}</span></li>`).join("")}</ul>
        ${seller}
        ${notGuaranteed}
        ${detail}
        ${adjudication(c)}
        ${trust}
        <div class="hash">Contract hash ${esc(c.contractHash)}</div>
        <div class="links">
          ${links}
          <a href="/${esc(c.service)}/contract?format=json">Machine-readable JSON</a>
          <a href="/#challenge">Try to break it</a>
        </div>
      </section>`;
  }

  const json = (url) => fetch(url, { headers: { accept: "application/json" } }).then((r) => r.json());
  Promise.all([json(single ? `/${single}/contract?format=json` : "/contracts"), json("/trust").catch(() => null)]).then(([data, trust]) => {
    const contracts = single ? [data] : data;
    if (single) {
      document.title = `${data.title} · Contract · PayBox Tribunal`;
      document.getElementById("h1").textContent = data.title;
      document.getElementById("lead").textContent = `The published contract for POST /${data.service}. If a result breaks any promise below, the response is 422 and your payment is never settled.`;
    }
    document.getElementById("list").innerHTML = contracts.map((c) => card(c, trust?.services?.[c.service])).join("");
  });
</script>
</body>
</html>
